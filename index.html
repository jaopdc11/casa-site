    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Casa</title>
    <script>
      // Aplica o tema ANTES do render para não piscar (mesma regra de src/lib/tema.ts).
      // Escuro é o padrão; "sistema" segue o aparelho; "claro" só se escolhido.
      var pref = 'escuro'
      try {
        pref = localStorage.getItem('casa:tema') || 'escuro'
      } catch (e) {}
      var escuro =
        pref === 'escuro' ||
        (pref === 'sistema' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches))
      if (escuro) document.documentElement.classList.add('dark')
      else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6f9')
    </script>
    <script type="module" crossorigin src="./assets/index-DucRYuE8.js"></script>
